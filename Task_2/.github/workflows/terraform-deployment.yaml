name: Terraform Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  YC_BUCKET: "my-terraform-state"  # Имя бакета в Yandex Object Storage/S3
  TF_STATE_KEY: "terraform.tfstate" # Ключ состояния в бакете

jobs:
  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.8

      - name: Validate Dev Environment
        run: |
          cd envs/dev
          terraform init -backend=false 
          terraform validate

      - name: Validate Stage Environment
        run: |
          cd envs/stage
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        run: |
          cd envs/prod
          terraform init -backend=false
          terraform validate

  plan:
    name: Plan Terraform Changes
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        environment: [dev, stage, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform with Yandex Cloud provider
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.5

      - name: Configure Yandex Cloud credentials
        run: |
          echo "${{ secrets.YC_SERVICE_ACCOUNT_KEY }}" > ~/.yc/key.json
          yc config set service-account-key ~/.yc/key.json

      - name: Terraform Init with remote state
        run: |
          cd envs/${{ matrix.environment }}
          terraform init \
            -backend-config="bucket=$YC_BUCKET" \
            -backend-config="key=$TF_STATE_KEY-${{ matrix.environment }}" \
            -backend-config="region=ru-central1" \
            -backend-config="access_key_id=${{ secrets.YC_ACCESS_KEY }}" \
            -backend-config="secret_access_key=${{ secrets.YC_SECRET_KEY }}"

      - name: Terraform Plan
        run: |
          cd envs/${{ matrix.environment }}
          terraform plan -var-file="${{ matrix.environment }}.tfvars" -out=planfile

      - name: Upload plan as artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: envs/${{ matrix.environment }}/planfile
          retention-days: 1

  apply:
    name: Apply Terraform Changes
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      matrix:
        environment: [dev, stage, prod]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.5

      - name: Download plan artifact
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: envs/${{ matrix.environment }}

      - name: Configure Yandex Cloud credentials
        run: |
          echo "${{ secrets.YC_SERVICE_ACCOUNT_KEY }}" > ~/.yc/key.json
          yc config set service-account-key ~/.yc/key.json

      - name: Terraform Init for apply
        run: |
          cd envs/${{ matrix.environment }}
          terraform init \
            -backend-config="bucket=$YC_BUCKET" \
            -backend-config="key=$TF_STATE_KEY-${{ matrix.environment }}" \
            -backend-config="region=ru-central1" \
            -backend-config="access_key_id=${{ secrets.YC_ACCESS_KEY }}" \
            -backend-config="secret_access_key=${{ secrets.YC_SECRET_KEY }}"

      - name: Terraform Apply
        run: |
          cd envs/${{ matrix.environment }}
          terraform apply -input=false planfile
        env:
          TF_VAR_ssh_key: ${{ secrets.SSH_KEY }}
